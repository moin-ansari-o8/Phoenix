[project]
name = "phoenix-assistant"
version = "5.9.0"
description = "Phoenix - Advanced Voice Assistant with Personal Management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Phoenix Developer" }
]

dependencies = [
    # Core dependencies
    "pyaudio>=0.2.11",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.0",
    "keyboard>=0.13.5",
    "faster-whisper>=1.0.0",
    
    # GUI and System
    "PyQt5==5.15.11",
    "tkinter-tooltip>=2.1.0",
    "pillow>=11.0.0",
    "plyer>=2.1.0",
    "pywin32>=310",
    "psutil>=7.0.0",
    "pyvda",
    
    # Automation
    "PyAutoGUI>=0.9.54",
    "pyperclip>=1.9.0",
    "selenium>=4.33.0",
    "webdriver-manager>=4.0.2",
    
    # Web and HTTP
    "requests>=2.32.0",
    "aiohttp>=3.12.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "bs4>=0.0.2",
    "websockets>=10.0",
    
    # AI and NLP
    "cohere>=5.15.0",
    "groq>=0.28.0",
    "huggingface-hub>=0.33.0",
    "tokenizers>=0.21.0",
    
    # Text Processing
    "markdown-it-py>=3.0.0",
    "Pygments>=2.19.0",
    "rich>=14.0.0",
    "mtranslate>=1.8",
    
    # Data and Files
    "PyYAML>=6.0.0",
    "python-dotenv>=1.1.0",
    "tabulate>=0.9.0",
    
    # Media
    "pygame>=2.6.0",
    "edge-tts>=7.0.0",
    "pywhatkit>=5.4",
    
    # Utilities
    "appopener>=1.7",
    "googlesearch-python>=1.3.0",
    "wikipedia>=1.4.0",
    "Flask>=3.1.0",
    "click>=8.2.0",
    "colorama>=0.4.6",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ['py310']
