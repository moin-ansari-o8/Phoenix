[project]
name = "phoenix-assistant"
version = "5.9.0"
description = "Phoenix - Advanced Voice Assistant with Personal Management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Phoenix Developer" }
]

dependencies = [
    # Pruned 2026-08-12 against a real import audit (see .github/temp-todo-beast-mode
    # E3). 25 declared-but-never-imported packages were removed and 4 packages that
    # action_utilities imports at MODULE level - so a fresh install crashed on
    # import - were added. Everything here is imported by live code; anything that
    # only arrives as a transitive dependency (tokenizers, huggingface-hub,
    # markdown-it-py, Pygments, lxml) is left to the package that requires it.

    # Speech in
    "pyaudio>=0.2.11",
    "faster-whisper>=1.0.0",
    "webrtcvad>=2.0.10",
    "SpeechRecognition>=3.10.0",
    "numpy>=1.26.0",
    # Phonetic matching for the Hinglish/song lexicon (Utils/limbs/lexicon.py)
    "rapidfuzz>=3.0.0",
    # Speaker verification (Utils/limbs/speaker_id.py). Optional at runtime -
    # speaker_id fails open if it is missing.
    # WARNING: `pip install resemblyzer` also pulls the `typing` BACKPORT, which
    # shadows the standard library on Python 3.10+ and breaks unrelated imports.
    # Uninstall it right after: `pip uninstall -y typing`.
    "resemblyzer>=0.1.4",

    # Speech out. SAPI5 via pyttsx3 is the default engine; edge-tts and pygame
    # serve the opt-in cloud path only (tts_engine: "edge").
    "pyttsx3>=2.90",
    "edge-tts>=7.0.0",
    "pygame>=2.6.0",

    # Windows control surface
    "pywin32>=310",
    "PyAutoGUI>=0.9.54",
    "keyboard>=0.13.5",
    "psutil>=7.0.0",
    "pyvda",
    "pygetwindow>=0.0.9",
    "comtypes>=1.4.0",
    "pycaw>=20240210",
    "plyer>=2.1.0",
    "pillow>=11.0.0",

    # Web lookup (search_web only; gated by web.enabled + offline_mode)
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",
    "wikipedia>=1.4.0",
    "pytube>=15.0.0",

    # TUI
    "rich>=14.0.0",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    # tests/test_listener_pipeline.py and tests/listen.py only
    "scipy>=1.11.0",
    "sounddevice>=0.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    # tests/test_listener_pipeline.py and tests/listen.py only
    "scipy>=1.11.0",
    "sounddevice>=0.4.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ['py310']


[tool.pytest.ini_options]
testpaths = ["tests"]
# Only files that pytest should collect. The standalone suites are driven
# through tests/test_suites.py as subprocesses, not collected directly - see
# that module for why sharing an interpreter between them is unsafe.
python_files = ["test_suites.py", "test_units.py", "test_theme.py", "test_sentence_stream.py", "test_trace.py"]
markers = [
    "slow: needs a live Ollama server (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow' --strict-markers -q"
